name: Downright
options:
  bundleIdPrefix: com.jarcec
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
packages:
  DownrightKit:
    path: ..
targets:
  Downright:
    type: application
    platform: macOS
    sources:
      - path: Downright
      # The command-line shim ships inside the bundle so the app can install it.
      - path: ../cli/downright
        buildPhase: resources
    dependencies:
      - package: DownrightKit
        product: DownrightEditor
      - package: DownrightKit
        product: MarkdownKit
      - package: DownrightKit
        product: DownrightConfig
    settings:
      base:
        PRODUCT_NAME: Downright
        PRODUCT_BUNDLE_IDENTIFIER: com.jarcec.Downright
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ad-hoc signing by default. `./devtool release` overrides CODE_SIGN_IDENTITY with
        # a Developer ID certificate (DOWNRIGHT_SIGN_IDENTITY) and notarizes when configured.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: Downright/Downright.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Downright/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Downright:
    build:
      targets:
        Downright: all
    run:
      config: Debug
    archive:
      config: Release
